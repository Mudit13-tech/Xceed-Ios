name: Remote AMS Sync & OTA Update

on:
  workflow_dispatch:

jobs:
  build-and-publish-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xceed-app repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to checkout branches and push
          token: ${{ secrets.GH_PAT }}

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout AMS repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AMS_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: temp-ams-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Safe Pull from AMS
        run: |
          set -euo pipefail

          # 1. Switch to ams-update branch
          git checkout ams-update || git checkout -b ams-update

          # 1b. Guard the vendor-branch invariant.
          #
          # ams-update must hold ONLY the AMS client tree — never this repo's own
          # files. `git pull origin main` while standing on ams-update quietly
          # fast-forwards it to main, and then the merge in step 5 degenerates
          # into a fast-forward: AMS's client/package.json (version 0.0.0, no
          # Capacitor, no deploy:ota) lands on main wholesale and the run dies at
          # `npm run deploy:ota` with "Missing script". Fail loudly here instead,
          # while main is still untouched.
          for marker in scripts/deploy-ota.cjs .github/workflows/deploy-ota.yml; do
            if git cat-file -e "ams-update:$marker" 2>/dev/null; then
              echo "::error::ams-update contains '$marker', which only exists on main — the vendor branch was fast-forwarded to main and no longer represents AMS. Reset it to the last 'Automated AMS Sync' commit (git branch -f ams-update <sha> && git push --force-with-lease origin ams-update) before re-running."
              exit 1
            fi
          done

          # 2. Unpack AMS's client folder OVER the app at the repo root.
          #
          # This is the half that has to match safe-pull-from-ams.ps1, which runs
          # `git archive HEAD:client | tar -x`. Archiving the *tree at* client
          # yields entries with no `client/` prefix, so they land on the root app:
          # src/, index.html, vite.config.js. The trailing `/.` below is what makes
          # cp copy the folder's *contents* rather than the folder itself — without
          # it you get a nested ./client/, a second copy of the whole app, and the
          # root app the OTA actually builds from receives nothing.
          echo "Copying client contents from AMS..."
          rm -rf client # drop the nested copy an earlier run may have committed
          cp -r temp-ams-repo/client/. .

          # 3. Drop the AMS checkout BEFORE staging — `git add -A` would otherwise
          # commit the entire AMS repo, embedded .git and all.
          rm -rf temp-ams-repo

          # 4. Commit changes to ams-update. Must be `-A`, not `add client`: the
          # sync lands on src/ and public/, so a client-only add stages nothing.
          git add -A
          if git diff --staged --quiet; then
            echo "No new changes found in AMS client."
          else
            git commit -m "Automated AMS Sync via GitHub Actions"
          fi

          # 5. Switch to main and merge.
          #
          # ams-update is a vendor branch: it records what AMS looked like at the
          # last sync and nothing else, which is why it still carries AMS's own
          # package.json (version 0.0.0, no Capacitor). That is what makes this a
          # real three-way merge rather than an overwrite — base is AMS-then,
          # theirs is AMS-now, ours is main with the local work on top. Files only
          # this repo changed keep our version, files only AMS changed take theirs,
          # and the same lines on both sides stop here for a human. Do not "fix"
          # this by resetting ams-update to main: that makes the base equal to ours,
          # so every local edit reads as a change AMS is reverting, and it is
          # discarded without a conflict.
          git checkout main

          # 4b. Register the merge drivers .gitattributes asks for. They live in
          # git config, which is per-clone and never committed, so on a fresh
          # runner the attributes are inert until this runs — and inert silently:
          # the merge just falls back to line-by-line and the conflicts this was
          # meant to remove come back with nothing to explain them.
          node build/gitMergeSetup.mjs
          if ! git merge --no-edit ams-update; then
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "::error::AMS sync conflicts in: $(echo $conflicts)"
            for file in $conflicts; do
              echo "::group::$file"
              git diff -- "$file" | head -200
              echo "::endgroup::"
            done
            echo "A file conflicting here means this repo edits lines AMS also edits."
            echo "If the file is one we have effectively rewritten, it belongs beside"
            echo "its AMS copy as <name>.mobile.<ext> instead — see build/mobileOverrides.js."
            git merge --abort
            exit 1
          fi

          # 6. Last line of defence: whatever the merge did, main must still be
          # this repo's app, not AMS's bare client.
          if ! grep -q '"deploy:ota"' package.json; then
            echo "::error::package.json lost the deploy:ota script in the AMS merge — AMS's client/package.json overwrote ours. Not deploying."
            exit 1
          fi

          # 7. Rebuild the lockfile against the merged manifest. .gitattributes
          # keeps our package-lock.json whole through the merge — a lockfile
          # conflict cannot be resolved by hand and means nothing when it
          # happens — which leaves it describing the dependencies from before
          # the sync. npm ci refuses a lockfile that disagrees with its
          # package.json, so without this a sync that pulled in a new web
          # dependency fails at install with nothing pointing back here.
          npm install --package-lock-only --no-audit --no-fund

          # 8. Say what upstream changed in the files we override. These no
          # longer conflict, which is the point, but it also means their changes
          # now arrive silently — this is the only thing that reports them.
          node build/amsDrift.mjs || true

      - name: Install dependencies
        run: npm ci || npm install

      - name: Deploy OTA
        env:
          OTA_SECRET_KEY: ${{ secrets.OTA_SECRET_KEY }}
          OTA_SERVER_URL: ${{ secrets.OTA_SERVER_URL }}
        run: npm run deploy:ota

      - name: Push AMS sync and version bump back to repository
        run: |
          set -euo pipefail

          git add package.json package-lock.json
          # The deploy script only writes the bump once the upload is accepted, so
          # no staged change here just means no new version was published.
          if ! git diff --staged --quiet; then
            git commit -m "Bump version for OTA update [skip ci]"
          else
            echo "No version change (deploy published nothing new)."
          fi

          # Push unconditionally. Gating this on the version bump meant a run that
          # synced AMS without publishing a new version left its sync commit on the
          # runner and threw it away.
          #
          # --atomic, the way safe-pull-from-ams.ps1 does it: both refs or neither.
          # Pushed one at a time, a failure on the second call lands main while
          # ams-update stays behind, and the next sync then merges against a base
          # older than what main already carries. That skew does not error - it
          # reads local edits as changes AMS is reverting and drops them with no
          # conflict raised.
          git push --atomic origin main ams-update
