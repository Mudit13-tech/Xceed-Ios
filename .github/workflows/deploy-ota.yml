name: Remote AMS Sync & OTA Update

on:
  workflow_dispatch:

jobs:
  build-and-publish-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xceed-app repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to checkout branches and push
          token: ${{ secrets.GH_PAT }}

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout AMS repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.AMS_REPO }}
          token: ${{ secrets.GH_PAT }}
          path: temp-ams-repo

      - name: Safe Pull from AMS
        run: |
          # 1. Switch to ams-update branch
          git checkout ams-update || git checkout -b ams-update

          # 2. Replicate git archive behavior
          echo "Copying client folder from AMS..."
          rm -rf client # Clean existing just in case
          cp -r temp-ams-repo/client .

          # 3. Commit changes to ams-update
          git add client
          if git diff --staged --quiet; then
            echo "No new changes found in AMS client."
          else
            git commit -m "Automated AMS Sync via GitHub Actions"
          fi

          # 4. Switch to main and attempt merge
          git checkout main
          if ! git merge ams-update; then
            echo "::error::Merge conflict detected! Aborting merge."
            git merge --abort
            exit 1
          fi

          # Clean up temporary ams repo
          rm -rf temp-ams-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Deploy OTA
        env:
          OTA_SECRET_KEY: ${{ secrets.OTA_SECRET_KEY }}
          OTA_SERVER_URL: ${{ secrets.OTA_SERVER_URL }}
        run: npm run deploy:ota

      - name: Push version bump back to repository
        run: |
          git add package.json package-lock.json
          # Only commit if package.json was changed by the deploy script
          if ! git diff --staged --quiet; then
            git commit -m "Bump version for OTA update [skip ci]"
            git push origin main
            git push origin ams-update
          else
            echo "No version changes detected."
          fi
